# split_on_transmission with split_timestamp_milliseconds.
# Each timestamp in a file name gets the milliseconds after the seconds,
# <template>_YYYYMMDD_HHMMSS.mmm, so recordings can be lined up with other
# time-stamped data (ADS-B, logs) to better than a second.
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

# Global default for every split_on_transmission output
split_timestamp_milliseconds = true;

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 120.0;
  correction = 80;
  channels:
  (
    {
      freq = 119.5;
      outputs: (
        {
          # TWR_20260922_101500.250_119500000.mp3
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "TWR";
          split_on_transmission = true;
          include_freq = true;
        },
        {
          # with split_include_transmission_start both timestamps get milliseconds:
          # TWR_LONG_20260922_101500.250_20260922_101600.262.mp3
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "TWR_LONG";
          split_on_transmission = true;
          split_include_transmission_start = true;
          split_max_file_time = 60;
        }
      );
    },
    {
      freq = 120.225;
      outputs: (
        {
          # per-output override: whole seconds only, GND_20260922_101500.mp3
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "GND";
          split_on_transmission = true;
          split_timestamp_milliseconds = false;
        }
      );
    }
  );
 }
);
