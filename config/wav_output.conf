# File outputs writing WAV instead of MP3.
# format = "wav" writes 16-bit PCM at the demodulator's rate (8000 Hz, or 16000 Hz
# when built with NFM), mono (stereo for mixers with balance). No encoder runs, so
# it costs less CPU than MP3 and the audio starts at the first sample of the file,
# without MP3's encoder delay. Files are about 16 KB per second of audio at 8000 Hz.
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 120.0;
  correction = 80;
  channels:
  (
    {
      freq = 119.5;
      outputs: (
        {
          # one file per transmission, named to the millisecond:
          # TWR_20260922_101500.250_119500000.wav
          type = "file";
          format = "wav";
          directory = "/home/pi/recordings";
          filename_template = "TWR";
          split_on_transmission = true;
          split_timestamp_milliseconds = true;
          include_freq = true;
        }
      );
    },
    {
      freq = 120.225;
      outputs: (
        {
          # hourly files; appending to an existing file adds the usual
          # discontinuity tones, as 16-bit PCM
          type = "file";
          format = "wav";
          directory = "/home/pi/recordings";
          filename_template = "GND";
        }
      );
    }
  );
 }
);
